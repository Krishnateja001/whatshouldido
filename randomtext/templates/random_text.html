<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Should I Do?</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark-mode {
            background-color: #1a1a1a;
            color: white;
        }
        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            flex-direction: column;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark-mode .theme-toggle {
            background-color: #333;
            color: white;
            border-color: #555;
        }
        .text-container {
            text-align: center;
            padding: 20px;
        }
        .loading-text, .error-text {
            color: inherit;
            font-size: 18px;
        }
        .error-text {
            color: #ff6b6b;
        }
        body.dark-mode .error-text {
            color: #ff8787;
        }
        .random-text {
            color: inherit;
            font-size: 35px;
            font-weight: bold;
            margin: 0;
            line-height: 1.6;
            letter-spacing: 0.5px;
            max-width: 600px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        body.dark-mode .random-text {
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.1);
        }
        .get-another-btn {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function RandomTextDisplay() {
            const [text, setText] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved ? JSON.parse(saved) : false;
            });

            useEffect(() => {
                fetchRandomText();
            }, []);

            useEffect(() => {
                localStorage.setItem('darkMode', JSON.stringify(darkMode));
                if (darkMode) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            }, [darkMode]);

            const fetchRandomText = async () => {
                try {
                    setLoading(true);
                    const response = await fetch('/api/random-text/');
                    if (!response.ok) {
                        throw new Error('Failed to fetch text');
                    }
                    const data = await response.json();
                    setText(data.text);
                    setError(null);
                } catch (err) {
                    setError(err.message);
                    setText('');
                } finally {
                    setLoading(false);
                }
            };

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
            };

            return (
                <>
                    <button 
                        onClick={toggleDarkMode}
                        className="theme-toggle"
                    >
                        {darkMode ? '☀️' : '🌙'}
                    </button>
                    <div className="text-container">
                        {loading && <p className="loading-text">Loading...</p>}
                        {error && <p className="error-text">Error: {error}</p>}
                        {text && (
                            <p className="random-text">
                                {text}
                            </p>
                        )}
                    </div>
                </>
            );
        }

        ReactDOM.render(<RandomTextDisplay />, document.getElementById('root'));
    </script>
</body>
</html>
